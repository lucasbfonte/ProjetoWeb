<!DOCTYPE html>
<html lang="pt-BR"> 
    <head>
        <meta charset="UTF-8">
        <title>Study Planner</title>
    </head>

    <body> 
        <h1>Study Planner</h1>
        <p>Site teste pra organizar as matérias de estudo</p>
        <section>
            <h2>Matérias</h2>
                <input type="text" id="subjectInput" placeholder="Nova matéria">
                <button id="addSubjectButton">Add</button>
                <ul id="subjectList">
                </ul>
        </section>
        <section>
            <h2>Tarefas</h2>

            <input type="text" id="taskInput" placeholder="Nova tarefa">
            <select id="subjectSelect">
                <option value="" disabled selected>Selecione uma matéria</option>
            </select>
            <button id="addTaskButton">Add</button>
            <ul id="taskList">
            </ul>
        </section>
    <script src="script.js"></script>
    </body>
    </html>
